[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrs-partlist-studio"
version = "0.1.0"
description = "Part List / BOM จากแบบ ZWCAD (DWG/DXF) เชื่อมสโตร์ คลังสินค้า ฝ่ายผลิต และ Google Sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "ezdxf>=1.4",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "gspread>=6.0",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "Pillow>=10",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
partlist-sync = "partlist_studio.sync_worker:main"

[project.gui-scripts]
partlist-studio = "partlist_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
partlist_studio = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
